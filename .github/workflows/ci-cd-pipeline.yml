name: Local risk-policy regression (not production acceptance)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tests (fail closed)
        run: python -m compileall -q tests
      - name: Rust unit tests and compilation
        run: cargo test --all-targets
      - name: Rust CLI subprocess and adversarial tests
        run: python -m unittest discover -s tests -p 'reality_*.py' -v
